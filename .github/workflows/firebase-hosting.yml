# Урок 17. Автоматический деплой web версии на Firebase Hosting при пуше в main.
# Перед использованием:
#  1) В .firebaserc укажите id своего Firebase проекта.
#  2) Выполните в проекте: firebase init hosting:github
#     Команда сама создаст секрет FIREBASE_SERVICE_ACCOUNT_<PROJECT_ID> в настройках репозитория.
#  3) Замените YOUR_FIREBASE_PROJECT_ID и имя секрета ниже на свои.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUR_FIREBASE_PROJECT_ID }}
          channelId: live
          projectId: YOUR_FIREBASE_PROJECT_ID
